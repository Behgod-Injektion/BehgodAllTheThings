[project]
site_name = "BehgodAllTheThings"
site_description = "دانشنامه آزاد علوم کامپیوتر و امنیت سایبری؛ از مبانی تا پژوهش تخصصی."
site_url = "https://behgod-injektion.github.io/BehgodAllTheThings/"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "خانه" = "index.md" },
  { "مبانی کامپیوتر" = [
    "01-computer-fundamentals/index.md",
    { "کامپیوتر چیست؟" = "01-computer-fundamentals/01-what-is-a-computer.md" },
    { "داده و اطلاعات" = "01-computer-fundamentals/02-data-and-information.md" },
    { "سیستم‌های عددی" = "01-computer-fundamentals/03-number-systems.md" },
    { "محاسبات دودویی" = "01-computer-fundamentals/04-binary-arithmetic.md" },
    { "نمایش داده در کامپیوتر" = "01-computer-fundamentals/05-data-representation.md" },
    { "اجزای سخت‌افزاری کامپیوتر" = "01-computer-fundamentals/06-computer-hardware.md" },
    { "مبانی پردازنده" = "01-computer-fundamentals/07-cpu-fundamentals.md" },
    { "حافظه و ذخیره‌سازی" = "01-computer-fundamentals/08-memory-and-storage.md" },
    { "نحوه اجرای برنامه‌ها" = "01-computer-fundamentals/09-how-programs-execute.md" },
    { "آشنایی با کد ماشین" = "01-computer-fundamentals/10-introduction-to-machine-code.md" },
  ] },
]

[project.theme]
language = "fa"
direction = "rtl"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "تغییر پوسته روشن/تیره"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "فعال‌سازی پوسته تیره"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "فعال‌سازی پوسته روشن"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
